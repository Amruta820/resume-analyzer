<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📄 Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and compare it with a job description.
        </p>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <label for="resume">Upload Your Resume (PDF)</label>

            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf"
                required
            >

            <label for="job_description">Job Description</label>

            <textarea
                id="job_description"
                name="job_description"
                rows="10"
                placeholder="Paste the job description here..."
                required
            ></textarea>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

</body>
</html>
